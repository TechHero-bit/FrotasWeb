<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="brand-block">
      <span class="brand-mark">FW</span>
      <div>
        <p class="eyebrow">Frotas Web</p>
        <h1 id="login-title">Acesso administrativo</h1>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form" novalidate>
      <label class="field">
        <span>E-mail</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="gestor@empresa.com"
          [class.invalid]="fieldHasError('email')"
        >
        <small *ngIf="fieldHasError('email')">Informe um e-mail valido.</small>
      </label>

      <label class="field">
        <span>Senha</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Digite sua senha"
          [class.invalid]="fieldHasError('password')"
        >
        <small *ngIf="fieldHasError('password')">A senha deve ter pelo menos 6 caracteres.</small>
      </label>

      <p
        *ngIf="errorMessage"
        class="login-error"
        [class.role-error]="isRoleError"
        role="alert"
      >
        {{ errorMessage }}
      </p>

      <button type="submit" class="submit-button" [disabled]="loading">
        {{ loading ? 'Validando...' : 'Entrar no dashboard' }}
      </button>

      <div class="web-login-footer">
        <a [routerLink]="['/motorista/login']" class="web-login-link">
          <span>Acessar Portal do Motorista Web</span>
          <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </form>
  </section>
</main>
