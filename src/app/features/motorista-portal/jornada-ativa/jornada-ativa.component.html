<div class="jornada-page">
  <div class="container">
    
    <div class="page-header">
      <div class="title-wrap">
        <span class="material-symbols-outlined icon">route</span>
        <h2 class="title">Jornada em Andamento</h2>
      </div>
      <div class="status-badge pulse">Ativa</div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-state">
      <span class="material-symbols-outlined spin">sync</span>
      Carregando jornada...
    </div>

    <ng-container *ngIf="!loading && jornada">
      
      <!-- Painel de Informações -->
      <section class="info-panel">
        <div class="timer-box">
          <span class="timer-label">Tempo de Rota</span>
          <span class="timer-value">{{ tempoDecorrido }}</span>
        </div>

        <div class="details-grid">
          <div class="detail-item">
            <span class="material-symbols-outlined">local_shipping</span>
            <div>
              <span class="label">Veículo</span>
              <span class="value">{{ jornada.veiculo_placa }}</span>
            </div>
          </div>
          <div class="detail-item">
            <span class="material-symbols-outlined">map</span>
            <div>
              <span class="label">Distância</span>
              <span class="value">{{ distancia }}</span>
            </div>
          </div>
          <div class="detail-item">
            <span class="material-symbols-outlined">schedule</span>
            <div>
              <span class="label">ETA (Previsto)</span>
              <span class="value">{{ eta }}</span>
            </div>
          </div>
        </div>

        <div class="route-addresses">
          <div class="address-item origem">
            <span class="dot origin-dot"></span>
            <div>
              <span class="label">Origem</span>
              <span class="value text-truncate">{{ jornada.origem }}</span>
            </div>
          </div>
          <div class="route-line"></div>
          <div class="address-item destino">
            <span class="dot dest-dot"></span>
            <div>
              <span class="label">Destino</span>
              <span class="value text-truncate">{{ jornada.destino }}</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Map Container -->
      <section class="map-section">
        <div class="map-wrapper" #mapContainer>
          <!-- MapLibre mounts here -->
        </div>
      </section>
      
      <!-- Ação Fixa Base -->
      <div class="fixed-bottom-action">
        <button class="btn-finalizar" (click)="finalizarJornada()">
          <span class="material-symbols-outlined">flag</span>
          Finalizar Jornada
        </button>
      </div>
    </ng-container>

  </div>
</div>
